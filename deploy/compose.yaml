name: resume-api

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: resume
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/ivansaldayev/test-resume-api:${IMAGE_TAG:?}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://resume:${POSTGRES_PASSWORD:?}@db:5432/resume
    networks:
      default:
      web:
        aliases:
          - resume-api
    depends_on:
      db:
        condition: service_healthy

networks:
  web:
    external: true

volumes:
  db-data:
