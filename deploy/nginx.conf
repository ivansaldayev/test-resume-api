server {
    listen 80;
    server_name saldayev.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://saldayev.ddns.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name saldayev.ddns.net;

    ssl_certificate /etc/letsencrypt/live/saldayev.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saldayev.ddns.net/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $resume_api http://resume-api:3000;

    location = / {
        return 302 /graphql;
    }

    location / {
        proxy_pass $resume_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
